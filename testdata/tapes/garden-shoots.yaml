# Gardener objects for the clusters dialog (⌘P): a garden's shoots, its
# projects and the shoots' CA config maps, looked up by gardener.Resolver.
lookupOnly: true
pipeline:
  source: {resource: shoots}
columns:
  - {name: Name, type: string, priority: 0}
initial:
  - object:
      apiVersion: core.gardener.cloud/v1beta1
      kind: Shoot
      metadata: {name: bar, namespace: garden-foo, uid: shoot-bar, creationTimestamp: "2026-01-01T10:00:00Z"}
      spec: {seedName: soil, kubernetes: {version: "1.33.1"}}
      status:
        technicalID: shoot--foo--bar
        advertisedAddresses: [{name: external, url: "https://api.bar.foo.tape.example"}]
    cells: [bar]
