# gardenctl's config for tests: the E2E launcher stages it in a private -garden
# home. Kubeconfig paths stay repo-relative (the backend runs from the repo root).
# Garden lookups go to the tapes (shoots, projects, ca-cluster config maps).
gardens:
- identity: tape-garden
  name: tg
  kubeconfig: testdata/garden/kubeconfig.yaml
  patterns:
  - "^((tg|tape-garden)/)?shoot--(?P<project>[^.]+)--(?P<shoot>[^.]+)$"
  - "(dashboard\\.tape\\.example)(/namespace/(?P<namespace>[^/]+))?(/shoots/(?P<shoot>[^/]+))?"
- identity: tape-missing
  kubeconfig: testdata/garden/missing.yaml
  patterns:
  - "^missing/(?P<shoot>.+)$"
