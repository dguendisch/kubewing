# E2E tape: secrets to decode (⏎ in the YAML): a managed resource's brotli-compressed manifests
# (a deployment, then a secret with a kubeconfig in it: decode deeper), a TLS pair (certificate,
# and the key that matches it) and a service account token (a JWT). The managed resource's
# deployment is scaled 1 → 2 at 1s, for the decoded diff.
pipeline:
  source: {resource: e2e-secrets}
columns:
  - {name: Name, type: string, priority: 0}
  - {name: Type, type: string, priority: 0}
  - {name: Age, type: string, priority: 0}
initial:
  - object: {apiVersion: v1, kind: Secret, metadata: {name: managedresource-vpn, namespace: shoot, uid: s-mr, creationTimestamp: "2026-01-01T10:00:00Z"}, type: Opaque, data: {data.yaml.br: ""}}
    cells: [managedresource-vpn, Opaque, 2h]
  - object: {apiVersion: v1, kind: Secret, metadata: {name: api-tls, namespace: shoot, uid: s-tls, creationTimestamp: "2026-01-01T10:00:00Z"}, type: kubernetes.io/tls, data: {tls.crt: "", tls.key: ""}}
    cells: [api-tls, kubernetes.io/tls, 2h]
  - object: {apiVersion: v1, kind: Secret, metadata: {name: e2e-token, namespace: shoot, uid: s-token, creationTimestamp: "2026-01-01T10:00:00Z"}, type: kubernetes.io/service-account-token, data: {token: ""}}
    cells: [e2e-token, kubernetes.io/service-account-token, 2h]
steps:
  - at: 1s
    update:
      object: {apiVersion: v1, kind: Secret, metadata: {name: managedresource-vpn, namespace: shoot, uid: s-mr, creationTimestamp: "2026-01-01T10:00:00Z"}, type: Opaque, data: {data.yaml.br: ""}}
      cells: [managedresource-vpn, Opaque, 2h]
  - at: 2s
    frame: true
