# Example ~/.kubewing/config.yaml (also the headless E2E config, see playwright.config.ts).
# kubewing only reads these files, except config.yaml when saved from ⌘, (E2E saves it back
# unchanged); the one it writes there is its own history.yaml
# (recent debug images; E2E writes it elsewhere, see -state in playwright.config.ts).
# Every setting with its default: internal/config/reference.yaml (⌘, shows it).

# themes/<name>.yaml; omit (or "default") for the built-in theme
theme: e2e

# one font for the whole app (E2E keeps the default: SF Mono, then Menlo, 12px, no ligatures)
#   family:    an installed font or a comma-separated list; SF Mono and Menlo come after it
#   size:      px, 8 … 24
#   ligatures: "->", "!=" joined into one glyph in fonts that have them; default false
# font:
#   family: JetBrainsMono Nerd Font
#   size: 13
#   ligatures: false

diff:
  # extra noise rules on top of the built-in ones (resourceVersion, managedFields, heartbeats …);
  # "*" matches every list element / map key, kinds optionally restricts a rule
  ignore:
    - {path: metadata.annotations.e2e\.kubewing/noise}

# Per-context safety rules (glob on the kubeconfig context name), first match wins.
#   label/color: shown on the pane frame, header and tab; color is a theme token or a color
#   readOnly:    every mutation (delete, exec, debug, opspod, edit, terminal, label, annotate, scale, restart) is refused
#   confirm:     actions that need confirmation; delete and restart always do
#   strict:      confirmation requires typing the object name
contexts:
  - {match: "*-prod", label: PROD, color: prod, readOnly: true}
  - {match: "*-live", label: LIVE, color: changed, strict: true}
  - {match: "*-dev", label: DEV, color: added, confirm: [delete, exec, debug, opspod, edit, terminal, label, annotate, scale]}
  # clusters picked in ⌘⇧O from the test garden (testdata/garden): <garden>/shoot--<project>--<name>
  - {match: "tape-garden/*", label: GARDEN, color: changed}

# b (debug container, as kubectl debug): defaults of the dialog
#   image:   prefilled (else the last image that started)
#   profile: general (default), baseline, restricted, netadmin or sysadmin
debug:
  image: nicolaka/netshoot

# n (node shell: a pod on a node, as ops-toolbelt's hacks/ops-pod): defaults of the dialog.
# Namespace and checkboxes are these until a pod ran; then the last used ones (history.yaml).
#   image:       prefilled (else the last image that started, debug containers' included)
#   namespace:   where the pod is created (default: default)
#   chroot:      the shell runs in /host, i.e. on the node (implies hostRoot; default false)
#   hostRoot:    mount the node's / at /host (default true)
#   hostNetwork: the node's network namespace (default true)
opsPod:
  image: europe-docker.pkg.dev/gardener-project/releases/gardener/ops-toolbelt:latest

# terminal panes (exec, debug, ops pods)
#   scrollback:   lines kept beyond the screen (default 10000, 100 … 1000000)
#   copyOnSelect: a mouse selection is copied when the button is released, in terminals and logs (default false)
terminal:
  scrollback: 20000

# launching kubewing from a terminal
#   wait: stay in the foreground, the shell waits and the log goes to the terminal (-wait overrides it);
#         default false: it detaches, the prompt comes back, the log goes to kubewing.log (state directory)
launch:
  wait: false

# update check (kubewing's GitHub releases)
#   checkDays:   days between automatic checks; 0 = off (kubewing → Check for Updates… still works); default 1
#   prereleases: offer release candidates (-rc.N) too; default false
update:
  checkDays: 1
  prereleases: false

# focus follows mouse: moving the mouse over a pane focuses it, without a click
# (fields, dialogs and menus keep the focus); default false
focusFollowsMouse: false
