# Relation tapes: see rel-pods.yaml. Cluster-scoped volumes: one bound to
# shop/data-0 and attached, one available, one released (its claim is gone),
# the one of gizmo-0's ephemeral volume.
filter: true
pipeline:
  source: {resource: rel-pvs}
columns:
  - {name: Name, type: string, priority: 0}
  - {name: Status, type: string, priority: 0}
initial:
  - object: {apiVersion: v1, kind: PersistentVolume, metadata: {name: pv-data-0, uid: rpv-data-0, creationTimestamp: "2026-01-01T10:00:00Z"}, spec: {claimRef: {namespace: shop, name: data-0, uid: rpvc-data-0}}, status: {phase: Bound}}
    cells: [pv-data-0, Bound]
  - object: {apiVersion: v1, kind: PersistentVolume, metadata: {name: pv-spare, uid: rpv-spare, creationTimestamp: "2026-01-01T10:00:00Z"}, spec: {}, status: {phase: Available}}
    cells: [pv-spare, Available]
  - object: {apiVersion: v1, kind: PersistentVolume, metadata: {name: pv-released, uid: rpv-released, creationTimestamp: "2026-01-01T10:00:00Z"}, spec: {claimRef: {namespace: shop, name: old, uid: rpvc-old}}, status: {phase: Released}}
    cells: [pv-released, Released]
  - object: {apiVersion: v1, kind: PersistentVolume, metadata: {name: pv-scratch, uid: rpv-scratch, creationTimestamp: "2026-01-01T10:00:00Z"}, spec: {claimRef: {namespace: shop, name: gizmo-0-scratch, uid: rpvc-scratch}}, status: {phase: Bound}}
    cells: [pv-scratch, Bound]
  - object: {apiVersion: v1, kind: PersistentVolume, metadata: {name: pv-db-0, uid: rpv-db-0, creationTimestamp: "2026-01-01T10:00:00Z"}, spec: {claimRef: {namespace: shop, name: data-db-0, uid: rpvc-db-0}}, status: {phase: Bound}}
    cells: [pv-db-0, Bound]
  - object: {apiVersion: v1, kind: PersistentVolume, metadata: {name: pv-db-1, uid: rpv-db-1, creationTimestamp: "2026-01-01T10:00:00Z"}, spec: {claimRef: {namespace: shop, name: data-db-1, uid: rpvc-db-1}}, status: {phase: Bound}}
    cells: [pv-db-1, Bound]
